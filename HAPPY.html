```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Sanam 🎂</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #12002f, #3b0066, #12002f);
    font-family: Arial, sans-serif;
    overflow: hidden;
    color: white;
}

/* Main Card */
.card {
    position: relative;
    width: 90%;
    max-width: 700px;
    min-height: 90vh;
    margin: 5vh auto;
    padding: 50px 20px;
    text-align: center;
    border-radius: 30px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 0 50px rgba(255,0,255,0.25);
    overflow: hidden;
}

/* Heading */
h1 {
    margin: 20px 0 10px;
    font-size: clamp(38px, 8vw, 70px);
    font-weight: 900;
    text-transform: uppercase;
    color: #fff;
    text-shadow:
        0 0 5px #fff,
        0 0 15px #ff4de1,
        0 0 30px #ff00c8,
        0 0 60px #ff00c8;
    animation: glow 1.5s infinite alternate;
}

@keyframes glow {
    from {
        transform: scale(1);
        text-shadow:
            0 0 5px #fff,
            0 0 15px #ff4de1,
            0 0 30px #ff00c8;
    }
    to {
        transform: scale(1.04);
        text-shadow:
            0 0 10px #fff,
            0 0 25px #ff4de1,
            0 0 50px #ff00c8,
            0 0 80px #ff00c8;
    }
}

.name {
    font-size: 42px;
    font-weight: bold;
    color: #ffd6ff;
    text-shadow: 0 0 20px #ff00dd;
}

/* Birthday Message */
.message {
    margin: 20px auto;
    max-width: 550px;
    font-size: 19px;
    line-height: 1.7;
    color: #f5eaff;
}

/* Cake */
.cake {
    position: relative;
    width: 220px;
    height: 150px;
    margin: 60px auto 20px;
}

.layer {
    position: absolute;
    left: 10px;
    width: 200px;
    height: 55px;
    border-radius: 15px;
    background: linear-gradient(#ff8bd8, #d52ca9);
    box-shadow: 0 10px 20px rgba(0,0,0,0.3);
}

.layer.top {
    top: 45px;
}

.layer.bottom {
    top: 90px;
    background: linear-gradient(#ffb3e8, #e849bd);
}

.cream {
    position: absolute;
    top: 82px;
    left: 10px;
    width: 200px;
    height: 20px;
    background: white;
    border-radius: 50%;
}

/* Candle */
.candle {
    position: absolute;
    width: 18px;
    height: 55px;
    background: repeating-linear-gradient(
        45deg,
        #fff,
        #fff 6px,
        #ff4da6 6px,
        #ff4da6 12px
    );
    left: 101px;
    top: -5px;
    border-radius: 5px;
}

.flame {
    position: absolute;
    width: 24px;
    height: 32px;
    background: #ffd21c;
    border-radius: 50% 50% 50% 50%;
    top: -38px;
    left: -3px;
    box-shadow: 0 0 15px #ffae00,
                0 0 30px #ff6a00;
    animation: flame 0.5s infinite alternate;
}

@keyframes flame {
    from {
        transform: scale(0.9) rotate(-4deg);
    }
    to {
        transform: scale(1.1) rotate(4deg);
    }
}

/* Balloons */
.balloon {
    position: absolute;
    width: 55px;
    height: 70px;
    border-radius: 50%;
    animation: float 4s ease-in-out infinite;
}

.balloon::after {
    content: "";
    position: absolute;
    width: 2px;
    height: 130px;
    background: rgba(255,255,255,0.5);
    left: 50%;
    top: 68px;
}

.b1 {
    background: #ff3b81;
    left: 5%;
    top: 25%;
    animation-delay: 0s;
}

.b2 {
    background: #4de1ff;
    right: 6%;
    top: 18%;
    animation-delay: 1s;
}

.b3 {
    background: #ffd43b;
    left: 12%;
    bottom: 12%;
    animation-delay: 2s;
}

.b4 {
    background: #9d5cff;
    right: 12%;
    bottom: 15%;
    animation-delay: 1.5s;
}

@keyframes float {
    0%,100% {
        transform: translateY(0) rotate(-3deg);
    }
    50% {
        transform: translateY(-30px) rotate(4deg);
    }
}

/* Confetti */
.confetti {
    position: fixed;
    width: 9px;
    height: 15px;
    top: -20px;
    animation: fall linear infinite;
}

@keyframes fall {
    0% {
        transform: translateY(-20px) rotate(0deg);
        opacity: 1;
    }
    100% {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
    }
}

/* Button */
.btn {
    display: inline-block;
    margin-top: 25px;
    padding: 15px 35px;
    border-radius: 50px;
    background: linear-gradient(90deg, #ff2fa4, #8c4dff);
    color: white;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
    box-shadow: 0 0 25px rgba(255,0,200,0.6);
    transition: 0.3s;
}

.btn:hover {
    transform: scale(1.08);
    box-shadow: 0 0 40px rgba(255,0,200,0.9);
}

.footer {
    margin-top: 25px;
    font-size: 14px;
    color: #d9c5e8;
}
</style>
</head>

<body>

<!-- Balloons -->
<div class="balloon b1"></div>
<div class="balloon b2"></div>
<div class="balloon b3"></div>
<div class="balloon b4"></div>

<!-- Confetti -->
<script>
for (let i = 0; i < 80; i++) {
    const confetti = document.createElement("div");
    confetti.className = "confetti";

    confetti.style.left = Math.random() * 100 + "vw";
    confetti.style.animationDuration =
        (Math.random() * 3 + 3) + "s";
    confetti.style.animationDelay =
        Math.random() * 5 + "s";

    const shapes = ["#ff3b81", "#ffd43b", "#4de1ff", "#9d5cff", "#5cff8d"];
    confetti.style.background =
        shapes[Math.floor(Math.random() * shapes.length)];

    document.body.appendChild(confetti);
}
</script>

<!-- Main Birthday Card -->
<div class="card">

    <div style="font-size:55px;">🎉🎈🎊</div>

    <h1>Happy Birthday</h1>

    <div class="name">SANAM 💖</div>

    <p class="message">
        Wishing you an amazing birthday filled with
        happiness, laughter, success and unforgettable
        memories! 🥳✨
        <br><br>
        Keep smiling, keep shining and have an absolutely
        wonderful day! 🌟
    </p>

    <!-- Animated Cake -->
    <div class="cake">

        <div class="candle">
            <div class="flame"></div>
        </div>

        <div class="layer top"></div>

        <div class="cream"></div>

        <div class="layer bottom"></div>

    </div>

    <div style="font-size:30px;">
        🎂✨🎁
    </div>

    <a href="#" class="btn">
        🎉 Celebrate! 🎉
    </a>

    <div class="footer">
        Made with ❤️ especially for Sanam
    </div>

</div>

</body>
</html>
```
